<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卷積到機率路徑</title>
<meta name="description" content="《從 Convolution 核心到生成式機率路徑》EP1–EP9 學習網頁：先答三題、看動畫、動手算、再答一次。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23151B2B'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%23C792EA'%3E%E2%88%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#0B0F1A; --surface:#151B2B; --surface2:#1B2236; --line:#263046; --axis:#7A8399;
  --text:#ECEFF4; --dim:#9AA3B5; --accent:#F4D35E;
  --x:#58C4DD; --z:#83C167; --off:#F4D35E; --g:#FF8C42; --int:#FFFFFF; --r:#C792EA;
  --data:#B9F3C4; --noise:#7F8CFF; --t:#F15BB5; --flow:#2EC4B6; --warn:#EF6F6C; --ok:#83C167;
  --radius:12px; --maxw:1120px;
  --f-head:"LXGW WenKai TC","Noto Sans TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--x);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);line-height:1.3;margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.mono{font-family:var(--f-mono)}
.dim{color:var(--dim)}
.c-f,.c-z{color:var(--z)} .c-g{color:var(--g)} .c-r{color:var(--r)} .c-x{color:var(--x)} .c-off{color:var(--off)} .c-int{color:var(--int)}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(11,15,26,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{font-family:var(--f-head);font-weight:700;color:var(--text);font-size:18px;white-space:nowrap}
.brand b{color:var(--r);font-family:Georgia,serif;font-weight:400;margin:0 2px}
.brand:hover{text-decoration:none}
nav.main{display:flex;gap:4px}
nav.main a{color:var(--dim);padding:6px 12px;border-radius:8px;font-size:14px;white-space:nowrap}
nav.main a:hover{color:var(--text);background:var(--surface);text-decoration:none}
nav.main a.on{color:var(--bg);background:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 16px;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none!important;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--axis)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:48px 0 40px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.hero h1{font-size:clamp(34px,5vw,54px);margin:14px 0 16px}
.hero h1 .hl{color:var(--accent)}
.hero p.lead{color:var(--dim);font-size:16.5px;margin:0 0 22px;max-width:34em}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative}
.stage canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:10px;background:var(--bg)}
.stage .tlabel{position:absolute;top:22px;left:24px;font-family:var(--f-mono);font-size:13px;color:var(--t)}
.stage .flabel{position:absolute;bottom:92px;right:24px;font-size:15px;color:var(--text);background:rgba(11,15,26,.7);padding:2px 8px;border-radius:6px}
.stage .ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--dim)}
.stage input[type=range]{flex:1;accent-color:var(--t)}
.stage .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:2px}

/* sections */
section.block{padding:28px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-size:24px;border-bottom:3px solid var(--accent);padding-bottom:2px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.step .k{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.step h3{font-size:18px;margin:4px 0 6px}
.step p{margin:0;color:var(--dim);font-size:14px;line-height:1.65}

.phase{margin-bottom:28px}
.phase-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.phase-head h3{font-size:19px}
.phase-head .rng{font-family:var(--f-mono);font-size:12px;color:var(--bg);background:var(--r);padding:1px 8px;border-radius:99px}
.phase-head p{margin:0;color:var(--dim);font-size:14px;flex-basis:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ucard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;color:var(--text);text-decoration:none!important;transition:transform .15s,border-color .15s}
.ucard:hover{transform:translateY(-2px);border-color:var(--axis)}
.thumb{position:relative;aspect-ratio:16/9;background:radial-gradient(120% 90% at 80% 10%,#232a52 0%,var(--bg) 70%);display:flex;align-items:flex-end;padding:12px;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .epn{font-family:var(--f-mono);font-size:42px;font-weight:600;color:rgba(236,239,244,.14);position:absolute;right:12px;top:4px}
.thumb .badge{position:relative;font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(11,15,26,.82);border:1px solid var(--line);color:var(--dim)}
.badge.live{color:var(--bg)!important;background:var(--ok)!important;border-color:var(--ok)!important}
.badge.done{color:var(--accent)!important;border-color:rgba(244,211,94,.5)!important}
.thumb .dur{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:12px;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:4px}
.ucard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.ucard .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--dim)}
.ucard h4{margin:0;font-family:var(--f-head);font-size:17px;line-height:1.4}
.ucard .tags{font-size:13px;color:var(--dim)}
.pbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}
.pbar i{display:block;height:100%;background:var(--r)}
.ucard .pbar{margin-top:10px}

/* unit page */
.crumb{font-size:13px;color:var(--dim);padding:20px 0 6px}
.crumb a{color:var(--dim)}
.uhead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-bottom:18px}
.uhead .tier{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.uhead h1{font-size:clamp(26px,3.6vw,38px);margin:6px 0 8px}
.uhead .hook{color:var(--dim);margin:0}
.uhead .prog{min-width:150px;text-align:right;font-size:13px;color:var(--dim)}
.uhead .prog .pbar{margin-top:6px}
.fbox{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--r);border-radius:10px;padding:6px 16px;overflow-x:auto;margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 16px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;font-size:15px}
.tabs a:hover{color:var(--text);text-decoration:none}
.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs a .n{font-family:var(--f-mono);font-size:11px;background:var(--line);padding:0 6px;border-radius:99px;margin-left:4px}
.panel{padding:22px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.card h3{font-size:19px;margin-bottom:6px}
.card .sub{color:var(--dim);font-size:14px;margin:0 0 12px}
.card.locked{opacity:.6}
ol.qs{padding-left:22px;margin:0}
ol.qs li{margin-bottom:14px}
textarea{width:100%;min-height:72px;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font:inherit;font-size:14.5px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--x);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ans{background:var(--bg);border-left:3px solid var(--ok);border-radius:6px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.ans .lbl{font-size:12px;color:var(--dim);display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cmp div{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:13.5px;white-space:pre-wrap;color:var(--dim)}
.cmp div b{display:block;font-size:12px;color:var(--text);font-weight:500}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.term{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.term .zh{font-weight:700}
.term .en{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.term .m{color:var(--r);margin:4px 0;min-height:1.6em}
.term .d{font-size:13.5px;color:var(--dim);line-height:1.6}
.prac{border-top:1px solid var(--line);padding:12px 0}
.prac:first-of-type{border-top:0}
.prac input{width:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 10px;font-family:var(--f-mono)}
.fb{font-size:14px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--warn)}
.hint{font-size:14px;color:var(--dim);background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}

/* video */
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;background:repeating-linear-gradient(135deg,var(--surface) 0 14px,#171e31 14px 28px);border:2px dashed var(--line);border-radius:var(--radius)}
.placeholder .ic{font-size:40px;line-height:1}
.placeholder h3{font-size:22px}
.placeholder p{margin:0;color:var(--dim);font-size:14px;max-width:30em}
.placeholder code{font-family:var(--f-mono);font-size:12px;background:var(--bg);padding:2px 8px;border-radius:6px;color:var(--accent)}
.vgrid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.seclist{list-style:none;margin:0;padding:0}
.seclist li button{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 4px;display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:baseline}
.seclist li button:hover:not([disabled]){background:var(--surface2)}
.seclist li button[disabled]{cursor:default}
.seclist .ts{font-family:var(--f-mono);font-size:13px;color:var(--x)}
.seclist .sl{font-size:12px;color:var(--dim);display:block}
.seclist li.cur button{background:var(--surface2)}
.note-est{font-size:12.5px;color:var(--dim);margin-top:8px}

/* notes */
.notes .card h3{color:var(--accent);font-size:18px}
.notes .card ul{margin:6px 0 0;padding-left:20px}
.notes details{margin-top:6px}
.notes summary{cursor:pointer;color:var(--x)}
.next{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(199,146,234,.15),transparent);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px}

/* flashcards */
.flip{perspective:1200px;max-width:520px;margin:0 auto}
.flip .inner{position:relative;height:260px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}
.flip .back{transform:rotateY(180deg);border-color:var(--r)}
.flip .face .big{font-family:var(--f-head);font-size:34px}
.flip .face .en{font-family:var(--f-mono);color:var(--dim)}
.flip .face .m{font-size:22px;color:var(--r)}
.flip .face .d{color:var(--dim)}
.flip .tag{position:absolute;top:12px;left:16px;font-size:12px;color:var(--dim)}
.fcbar{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}

/* quiz */
.qitem{border-top:1px solid var(--line);padding:16px 0}
.qitem:first-child{border-top:0;padding-top:0}
.qitem .qq{font-weight:500;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14.5px}
.opt:hover:not([disabled]){border-color:var(--axis)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(131,193,103,.12)}
.opt.wrong{border-color:var(--warn);background:rgba(239,111,108,.12)}
.why{font-size:14px;color:var(--dim);margin-top:8px}
.score{font-family:var(--f-mono);font-size:28px;color:var(--accent)}

/* unit foot */
.ufoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:18px 0 8px}

/* glossary & me */
.search{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 14px;font:inherit}
table.gl{width:100%;border-collapse:collapse;margin-top:16px;font-size:14.5px}
table.gl th{text-align:left;font-weight:500;color:var(--dim);font-size:13px;border-bottom:1px solid var(--line);padding:8px}
table.gl td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
table.gl td.m{color:var(--r)}
table.gl .ep a{font-family:var(--f-mono);font-size:12px;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat .v{font-family:var(--f-mono);font-size:26px;color:var(--accent)}
.stat .l{font-size:13px;color:var(--dim)}
.ok{color:var(--ok)}
footer{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 40px;color:var(--dim);font-size:13px}
.katex{font-size:1.05em}
.fbox .katex-display{margin:.6em 0}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:24px;padding-top:28px}
  .steps{grid-template-columns:1fr 1fr}
  .vgrid{grid-template-columns:1fr}
  .uhead{grid-template-columns:1fr}
  .uhead .prog{text-align:left}
  .stats{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  nav.main a{padding:6px 8px}
  .brand .long{display:none}
  .steps{grid-template-columns:1fr}
  .cmp{grid-template-columns:1fr}
  table.gl .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">Conv<b>∗</b>Path<span class="long"> 學習網頁</span></a>
    <nav class="main" id="nav">
      <a href="#home" data-nav="home">單元</a>
      <a href="#glossary" data-nav="glossary">術語表</a>
      <a href="#me" data-nav="me">我的學習</a>
    </nav>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer>
  <div class="wrap">《從 Convolution 核心到生成式機率路徑》EP1–EP9 學習網頁 · 動畫以 Manim 製作，資料畫面由真實計算產生 · 進度只存在這台裝置的瀏覽器裡</div>
</footer>

<script src="videos.js"></script>
<script src="content.js"></script>
<script>
(() => {
"use strict";
const UNITS = window.UNITS, SERIES = window.SERIES;
const LINKS = window.VIDEO_LINKS || {};
const app = document.getElementById("app");
const byId = Object.fromEntries(UNITS.map(u => [u.id, u]));
const pad2 = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad2(m)}:${pad2(x)}` : `${m}:${pad2(x)}`; };

/* ---------- storage ---------- */
const KEY = "convpath-progress-v1";
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { S = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const st = id => (S[id] ||= { pre: [], preSaved: false, post: [], postSaved: false, prac: {}, quiz: {}, quizBest: null, known: [], done: false });

/* ---------- video helpers ---------- */
const ytId = v => { if (!v) return ""; v = String(v).trim(); if (/^[\w-]{11}$/.test(v)) return v; const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : ""; };
const vid = u => { const L = LINKS[u.id] || {}; return { yt: ytId(L.youtube), mp4: (L.mp4 || "").trim(), noVoice: ytId(L.noVoice), dur: L.duration || u.estDur, times: Array.isArray(L.sections) && L.sections.length === u.sections.length ? L.sections : null }; };
const hasVideo = u => { const v = vid(u); return !!(v.yt || v.mp4); };
const secTimes = u => vid(u).times || u.sections.map(s => s.t);

/* ---------- progress ---------- */
function progress(u) {
  const s = st(u.id);
  const pracOk = u.practice.items.every((_, i) => s.prac[i] === true);
  const quizDone = Object.keys(s.quiz).length === u.quiz.length;
  const parts = [s.preSaved, pracOk, quizDone, s.postSaved, s.done];
  return { parts, pct: Math.round(parts.filter(Boolean).length / parts.length * 100) };
}

/* ---------- math ---------- */
function math(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false });
  }
}

/* ---------- views ---------- */
function statusBadge(u) {
  if (hasVideo(u)) return `<span class="badge live">▶ 可觀看</span>`;
  if (u.status === "done") return `<span class="badge done">影片完成・連結待上架</span>`;
  return `<span class="badge">製作中・連結預留</span>`;
}
function unitCard(u) {
  const v = vid(u), p = progress(u);
  const img = v.yt ? `<img src="https://i.ytimg.com/vi/${v.yt}/hqdefault.jpg" alt="" loading="lazy">` : "";
  return `<a class="ucard" href="#${u.id}">
    <div class="thumb">${img}<span class="epn">EP${pad2(u.no)}</span>${statusBadge(u)}<span class="dur">${esc(v.dur)}</span></div>
    <div class="body">

/* ---------- hero animation: x_t = t z + (1-t) ε ---------- */
let heroRAF = 0;
function startHero() {
  cancelAnimationFrame(heroRAF);
  const cv = document.getElementById("heroCanvas"); if (!cv) return;
  const ctx = cv.getContext("2d");
  let seed = 20261112; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = () => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
  const N = 2600, P = [];
  while (P.length < N) { const x = rnd() * 4 - 2, y = rnd() * 4 - 2; if ((Math.floor(x + 2) + Math.floor(y + 2)) % 2 === 0) P.push([x, y, gauss() * .9, gauss() * .9]); }
  const slider = document.getElementById("tSlider"), btn = document.getElementById("playBtn"), lab = document.getElementById("tLabel");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let playing = !reduce, phase = 0, t = reduce ? 1 : 0, last = performance.now();
  btn.textContent = playing ? "暫停" : "播放";
  slider.addEventListener("input", () => { playing = false; btn.textContent = "播放"; t = +slider.value; });
  btn.addEventListener("click", () => { playing = !playing; btn.textContent = playing ? "暫停" : "播放"; phase = Math.acos(1 - 2 * t); last = performance.now(); });
  const c0 = [127, 140, 255], c1 = [185, 243, 196];
  function draw(now) {
    if (!document.body.contains(cv)) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = cv.clientWidth;
    if (cv.width !== Math.round(W * dpr)) { cv.width = cv.height = Math.round(W * dpr); }
    if (playing) {
      phase += (now - last) / 1000 * 0.55; // 約 11 秒一個來回
      const raw = (1 - Math.cos(phase)) / 2;
      t = Math.min(1, Math.max(0, (raw - .06) / .88)); // 兩端停留一下
      slider.value = t.toFixed(2);
    }
    last = now;
    const S = cv.width, sc = S / 6.2, cx = S / 2, cy = S / 2;
    ctx.fillStyle = "#0B0F1A"; ctx.fillRect(0, 0, S, S);
    ctx.strokeStyle = `rgba(122,131,153,${0.06 + 0.16 * t})`; ctx.lineWidth = 1 * dpr;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if ((i + j) % 2 === 0) ctx.strokeRect(cx + (i - 2) * sc, cy + (j - 2) * sc, sc, sc);
    const col = c0.map((a, k) => Math.round(a + (c1[k] - a) * t));
    ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},0.85)`;
    const r = 1.35 * dpr;
    for (const [zx, zy, ex, ey] of P) {
      const x = t * zx + (1 - t) * ex, y = t * zy + (1 - t) * ey;
      ctx.fillRect(cx + x * sc - r / 2, cy - y * sc - r / 2, r, r);
    }
    lab.textContent = "t = " + t.toFixed(2);
    heroRAF = requestAnimationFrame(draw);
  }
  heroRAF = requestAnimationFrame(draw);
}

/* ---------- router ---------- */
let cur = { view: "", unit: null, tab: "" };
function route() {
  const h = location.hash.replace(/^#/, "") || "home";
  const [a, b] = h.split("/");
  document.querySelectorAll("#nav a").forEach(n => n.classList.toggle("on", n.dataset.nav === (byId[a] ? "home" : a)));
  if (byId[a]) {
    const tab = ["sheet", "video", "notes", "cards", "quiz"].includes(b) ? b : "sheet";
    const same = cur.unit === a;
    cur = { view: "unit", unit: a, tab };
    viewUnit(byId[a], tab);
    document.title = `EP${pad2(byId[a].no)} ${byId[a].title}｜卷積到機率路徑`;
    if (!same) window.scrollTo(0, 0);
  } else if (a === "glossary") { cur = { view: a }; viewGlossary(); document.title = "術語表｜卷積到機率路徑"; window.scrollTo(0, 0); }
  else if (a === "me") { cur = { view: a }; viewMe(); document.title = "我的學習｜卷積到機率路徑"; window.scrollTo(0, 0); }
  else { cur = { view: "home" }; viewHome(); document.title = "卷積到機率路徑"; window.scrollTo(0, 0); }
}
const rerender = () => { const y = scrollY; viewUnit(byId[cur.unit], cur.tab); window.scrollTo(0, y); };

/* ---------- actions ---------- */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, u = byId[cur.unit], s = u ? st(u.id) : null;
  switch (act) {
    case "savePre":
      s.pre = u.pre.map((_, i) => (app.querySelector(`[data-pre="${i}"]`)?.value || "").trim());
      if (s.pre.every(x => !x) && !confirm("三題都是空白，確定要存下前測嗎？")) return;
      s.preSaved = true; save(); rerender(); break;
    case "savePost":
      s.post = u.pre.map((_, i) => (app.querySelector(`[data-post="${i}"]`)?.value || "").trim());
      s.postSaved = true; save(); rerender(); break;
    case "redoPost": s.postSaved = false; save(); rerender(); break;
    case "check": {
      const i = +el.dataset.i, it = u.practice.items[i];
      const raw = (app.querySelector(`[data-pin="${i}"]`).value || "").replace(/，/g, ".").replace(/[^\d.\-\/eE]/g, "");
      let v = raw.includes("/") ? raw.split("/").reduce((a, b) => a / b) : parseFloat(raw);
      const fb = app.querySelector(`[data-fb="${i}"]`);
      if (!isFinite(v)) { fb.className = "fb no"; fb.textContent = "請輸入數字"; return; }
      const ok = Math.abs(v - it.a) <= it.tol;
      s.prac[i] = ok; save();
      fb.className = "fb " + (ok ? "ok" : "no"); fb.textContent = ok ? "✓ 正確" : "✗ 再想想（可以看提示）";
      break;
    }
    case "hint": { const h = app.querySelector(`[data-hint="${el.dataset.i}"]`); h.hidden = !h.hidden; break; }
    case "done": s.done = !s.done; save(); rerender(); break;
    case "seek": seek(u, +el.dataset.t); break;
    case "flip": fc.flipped = !fc.flipped; el.classList.toggle("on", fc.flipped); break;
    case "fcPrev": fc.i = (fc.i - 1 + u.terms.length) % u.terms.length; fc.flipped = false; rerender(); break;
    case "fcNext": fc.i = (fc.i + 1) % u.terms.length; fc.flipped = false; rerender(); break;
    case "fcYes": if (!s.known.includes(fc.i)) s.known.push(fc.i); save(); fc.i = (fc.i + 1) % u.terms.length; fc.flipped = false; rerender(); break;
    case "fcNo": s.known = s.known.filter(k => k !== fc.i); save(); fc.i = (fc.i + 1) % u.terms.length; fc.flipped = false; rerender(); break;
    case "ans": {
      s.quiz[+el.dataset.q] = +el.dataset.o;
      if (Object.keys(s.quiz).length === u.quiz.length) { const c = u.quiz.filter((q, i) => s.quiz[i] === q.a).length; s.quizBest = Math.max(s.quizBest ?? 0, c); }
      save(); rerender(); break;
    }
    case "quizReset": s.quiz = {}; save(); rerender(); break;
    case "resetAll": if (confirm("確定要清除全部九集的學習進度嗎？這個動作無法復原。")) { S = {}; save(); viewMe(); } break;
  }
});
app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("[data-pin]")) app.querySelector(`[data-act="check"][data-i="${e.target.dataset.pin}"]`).click();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".flip")) { e.preventDefault(); e.target.click(); }
});
app.addEventListener("input", e => { // 草稿即時保存
  const u = byId[cur.unit]; if (!u) return; const s = st(u.id);
  if (e.target.dataset.pre !== undefined) { s.pre[+e.target.dataset.pre] = e.target.value; save(); }
  if (e.target.dataset.post !== undefined) { s.post[+e.target.dataset.post] = e.target.value; save(); }
});

window.addEventListener("hashchange", route);
if (document.readyState === "complete") route(); else window.addEventListener("load", route);
})();
</script>
